<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="askBust">
      <circle cx="41" cy="50" r="31"/>
    </clipPath>
    <clipPath id="askFace">
      <circle cx="39" cy="41" r="11.5"/>
    </clipPath>
    <linearGradient id="askHairG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#adadad"/>
      <stop offset="1" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="askFaceG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#d9d9d9"/>
    </linearGradient>
    <linearGradient id="askNeckG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9a9a9"/>
      <stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <linearGradient id="askSuitG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#999999"/>
      <stop offset="1" stop-color="#474747"/>
    </linearGradient>
    <linearGradient id="askTieG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3d3d"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <!-- Black blob: main circle merged with the rounded top-right corner shape,
       with smooth gooey transitions into the circle on both sides -->
  <path fill="#141414" d="M52 0 H84 Q100 0 100 16 V27 Q100 31 95 31.2 C83 31.4 66.1 30.6 69.1 36.9 A31 31 0 1 1 41 19 C49 19 49.5 0 52 0 Z"/>

  <g clip-path="url(#askBust)">
    <!-- neck (shaded under the chin) -->
    <rect x="36" y="49" width="7" height="9" fill="url(#askNeckG)"/>
    <!-- shoulders / suit -->
    <path d="M3 92 C5 70 15 59.8 27 57.8 L33.4 56.3 L39 59.8 L44.6 56.3 L51 57.8 C63 59.8 73 70 75 92 Z" fill="url(#askSuitG)"/>
    <!-- shirt collar -->
    <path d="M33.4 56.3 L39 59.8 L44.6 56.3 L46.2 61.6 L39 65.2 L31.8 61.6 Z" fill="#f7f7f7"/>
    <!-- tie: knot + blade -->
    <path d="M39 59.2 L41.6 61.8 L39 64 L36.4 61.8 Z" fill="#454545"/>
    <path d="M39 63.5 L41.2 66 L40.2 76 L39 78.2 L37.8 76 L36.8 66 Z" fill="url(#askTieG)"/>
    <!-- face -->
    <circle cx="39" cy="41" r="11.5" fill="url(#askFaceG)"/>
    <!-- soft jaw shadow on the lower face -->
    <g clip-path="url(#askFace)">
      <ellipse cx="39" cy="51.5" rx="10.5" ry="5" fill="#1a1a1a" opacity="0.13"/>
    </g>
    <!-- hair -->
    <path d="M26.8 46.5 V41 A12.2 12.2 0 0 1 51.2 41 V46.5 H45.8 Q47.8 37.6 40.5 37 Q32.6 37.6 33.6 46.5 Z" fill="url(#askHairG)"/>
  </g>

  <!-- question mark -->
  <path d="M53 31.5 C51.8 25 56 21.2 60.3 22.2 C65 23.3 67 27.8 64.6 31.4 C63 33.8 60.6 34.6 59.8 37.2 C59.4 38.4 59.3 39.3 59.3 40.6" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/>
  <circle cx="59.3" cy="47.3" r="3.1" fill="#fff"/>
</svg>
